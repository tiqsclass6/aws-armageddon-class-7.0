name: Lab 3B Terraform Pipeline

on:
  push:
    branches:
      - lab-3b

  workflow_dispatch:
    inputs:
      action:
        description: "Choose Terraform action"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: sa-east-1
  AWS_DEFAULT_REGION: sa-east-1
  TF_IN_AUTOMATION: "true"
  TF_WORKSPACE: lab-3b

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: lab-3b

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ARMAGEDDON_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ARMAGEDDON_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Verify Tools
        run: |
          terraform --version
          aws --version

      - name: Terraform Format
        run: terraform fmt -check -recursive -no-color || true

      - name: Terraform Init
        run: |
          aws sts get-caller-identity
          terraform init -no-color

      - name: Terraform Validate
        run: terraform validate -no-color

      - name: Terraform Plan
        run: terraform plan -no-color -out=tfplan

      - name: Upload tfplan Artifact
        uses: actions/upload-artifact@v7
        with:
          name: tfplan
          path: tfplan
          if-no-files-found: error

  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'apply' }}
    environment: lab-3b

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: lab-3b

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ARMAGEDDON_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ARMAGEDDON_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -no-color

      - name: Download tfplan Artifact
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform Apply
        run: terraform apply -no-color -auto-approve tfplan

  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    needs: plan
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.action == 'destroy' }}
    environment: lab-3b

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          ref: lab-3b

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.ARMAGEDDON_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.ARMAGEDDON_AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform Init
        run: terraform init -no-color

      - name: Terraform Destroy
        run: terraform destroy -no-color -auto-approve